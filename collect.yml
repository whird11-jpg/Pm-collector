name: collect

on:
  schedule:
    - cron: "*/5 * * * *"     # snapshots, every 5 minutes
    - cron: "17 3 * * *"      # resolver, once a day
  workflow_dispatch:           # lets you trigger a run by hand from the phone

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Snapshot open markets
        # loop internally for 4.5 min so 5-minute contracts get sampled
        # at more than just their opening tick
        run: python collect.py --duration 4.5 --every 60

      - name: Resolve closed markets
        if: github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch'
        run: python resolve.py

      - name: Commit data
        run: |
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # the schedule can overlap; rebase rather than fail
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 5
            done
          fi
